services:
  - type: web
    name: common-ground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
